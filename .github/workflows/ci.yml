name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Cài dependency cố định
        run: pnpm install --frozen-lockfile
      - name: Quality gate TypeScript
        run: pnpm run quality
      - name: Audit dependency npm
        run: pnpm audit --audit-level=high

  docs-security:
    name: Tài liệu và secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Kiểm tra tài liệu
        run: node scripts/check-docs.mjs
      - name: Quét secret cơ bản
        run: node scripts/scan-secrets.mjs
