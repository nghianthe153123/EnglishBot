<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">P1-003: trang Tích hợp ở viewport 1024 px</title>
  <desc id="desc">Wireframe xám: sidebar cố định, nội dung một cột, thông tin scope và thời hạn sát nút cấp quyền.</desc>
  <rect width="1024" height="768" fill="#f5f5f5"/>
  <g font-family="Arial, sans-serif" fill="#202020">
    <rect x="12" y="12" width="1000" height="744" rx="4" fill="#fff" stroke="#555"/>
    <line x1="224" y1="12" x2="224" y2="756" stroke="#777"/>
    <text x="32" y="51" font-size="21" font-weight="700">EnglishBot</text>
    <line x1="28" y1="75" x2="208" y2="75" stroke="#aaa"/>
    <text x="32" y="116" font-size="15">Hôm nay</text>
    <text x="32" y="158" font-size="15">Từ vựng</text>
    <text x="32" y="200" font-size="15">Bài học</text>
    <text x="32" y="242" font-size="15">Nguồn</text>
    <rect x="24" y="264" width="192" height="42" fill="#dedede"/>
    <text x="32" y="290" font-size="15" font-weight="700">Tích hợp</text>
    <text x="32" y="340" font-size="15">Cài đặt</text>

    <text x="260" y="58" font-size="25" font-weight="700">Tích hợp</text>
    <text x="260" y="88" font-size="14">Chia sẻ bản quét và chuyển từ vựng</text>
    <line x1="260" y1="113" x2="974" y2="113" stroke="#aaa"/>
    <text x="260" y="151" font-size="19" font-weight="700">Chia sẻ với ChatGPT</text>
    <text x="260" y="180" font-size="14">Tài khoản: learner@example…</text>
    <text x="260" y="223" font-size="13">Nguồn được chọn</text>
    <rect x="260" y="236" width="714" height="65" fill="#f1f1f1" stroke="#777"/>
    <text x="277" y="263" font-size="15">The science of learning · example.com</text>
    <text x="277" y="286" font-size="13">Bản quét còn hiệu lực</text>
    <text x="260" y="342" font-size="14">Dữ liệu: nội dung và tìm kiếm trong bản quét này</text>
    <text x="260" y="373" font-size="14">Thời hạn: 30 phút từ lúc cấp quyền</text>
    <text x="260" y="404" font-size="14">Tool thay đổi dữ liệu cần duyệt riêng.</text>
    <rect x="260" y="426" width="240" height="45" fill="#dedede" stroke="#555"/>
    <text x="281" y="455" font-size="14" font-weight="700">Cho phép trong 30 phút</text>

    <line x1="260" y1="513" x2="974" y2="513" stroke="#aaa"/>
    <text x="260" y="552" font-size="19" font-weight="700">Quizlet</text>
    <text x="260" y="580" font-size="14">Xem trước và xuất văn bản để bạn tự nhập vào Quizlet.</text>
    <rect x="260" y="605" width="192" height="44" fill="#fff" stroke="#555"/>
    <text x="287" y="633" font-size="14">Chọn từ để xuất</text>
    <text x="260" y="703" font-size="13">Liên kết tài khoản không tự chia sẻ nguồn · Không có đồng bộ trực tiếp trong beta</text>
  </g>
</svg>
