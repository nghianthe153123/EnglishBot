<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">P1-003: trang Tích hợp ở viewport 390 px</title>
  <desc id="desc">Wireframe xám: điều hướng thu gọn, thông tin chia sẻ MCP theo một cột và lối vào xuất Quizlet.</desc>
  <rect width="390" height="844" fill="#f5f5f5"/>
  <g font-family="Arial, sans-serif" fill="#202020">
    <rect x="12" y="12" width="366" height="820" rx="4" fill="#fff" stroke="#555"/>
    <text x="28" y="47" font-size="18" font-weight="700">EnglishBot</text>
    <rect x="319" y="26" width="42" height="32" fill="#eee" stroke="#555"/>
    <text x="326" y="47" font-size="14">Menu</text>
    <line x1="12" y1="72" x2="378" y2="72" stroke="#777"/>
    <text x="28" y="104" font-size="23" font-weight="700">Tích hợp</text>
    <text x="28" y="131" font-size="13">MCP và Quizlet</text>

    <line x1="28" y1="153" x2="362" y2="153" stroke="#aaa"/>
    <text x="28" y="184" font-size="18" font-weight="700">Chia sẻ với ChatGPT</text>
    <text x="28" y="212" font-size="14">Tài khoản: learner@example…</text>
    <text x="28" y="244" font-size="13">Nguồn được chọn</text>
    <rect x="28" y="255" width="334" height="60" fill="#f1f1f1" stroke="#777"/>
    <text x="40" y="279" font-size="14">The science of learning</text>
    <text x="40" y="300" font-size="12">example.com · bản quét còn hiệu lực</text>
    <text x="28" y="343" font-size="13">Dữ liệu chia sẻ</text>
    <text x="28" y="365" font-size="14">Nội dung và tìm kiếm trong bản quét này</text>
    <text x="28" y="396" font-size="13">Thời hạn</text>
    <text x="28" y="418" font-size="14">30 phút từ lúc cấp quyền</text>
    <text x="28" y="449" font-size="13">Tool thay đổi dữ liệu cần duyệt riêng.</text>
    <rect x="28" y="470" width="334" height="46" fill="#dedede" stroke="#555"/>
    <text x="101" y="499" font-size="14" font-weight="700">Cho phép trong 30 phút</text>

    <line x1="28" y1="549" x2="362" y2="549" stroke="#aaa"/>
    <text x="28" y="583" font-size="18" font-weight="700">Quizlet</text>
    <text x="28" y="610" font-size="14">Xuất văn bản để tự nhập vào Quizlet.</text>
    <rect x="28" y="630" width="334" height="44" fill="#fff" stroke="#555"/>
    <text x="112" y="658" font-size="14">Chọn từ để xuất</text>
    <text x="28" y="706" font-size="13">Việc liên kết tài khoản không tự chia sẻ nguồn.</text>
    <text x="28" y="729" font-size="13">Không có đồng bộ trực tiếp trong beta.</text>
  </g>
</svg>
